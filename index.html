<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Scanner de Motricidade Facial (Protocolo Clínico)</title>
    
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

    <style>
        body { font-family: Arial, sans-serif; padding: 15px; max-width: 600px; margin: auto; text-align: center; background-color: #f4f4f9; }
        
        .video-container {
            position: relative; width: 100%; max-width: 400px; margin: 10px auto;
            border: 3px solid #333; border-radius: 12px; overflow: hidden;
            background-color: #000; aspect-ratio: 3/4;
        }
        
        #videoElement, #canvasElement { width: 100%; height: 100%; object-fit: cover; display: block; }
        #canvasElement { position: absolute; top: 0; left: 0; pointer-events: none; }
        
        .espelhado { transform: scaleX(-1); }

        .botoes-container { display: flex; flex-direction: column; gap: 10px; margin-top: 15px; }
        .botoes-linha { display: flex; gap: 10px; width: 100%; }
        .botoes-linha button { flex: 1; }
        
        button { padding: 15px; font-size: 16px; font-weight: bold; cursor: pointer; color: white; border: none; border-radius: 8px;}
        button:disabled { background: #ccc !important; cursor: not-allowed; }
        
        #btnStartCamera { background: #007bff; }
        #btnSwitchCamera { background: #17a2b8; display: none; } 
        #btnToggleMask { background: #6f42c1; display: none; } 
        #btnRecord { background: #28a745; display: none; }
        #btnStop { background: #d9534f; display: none; }
        
        /* Botões de Exportação Clínica */
        .btn-export { margin-top: 10px; width: 100%; }
        #btnDownloadRaw { background: #343a40; display: none; }
        #btnDownloadAmp { background: #e0a800; display: none; color: #000;}
        
        #status { margin-top: 10px; font-weight: bold; color: #d9534f; }
        #contador { font-size: 16px; color: #28a745; font-weight: bold; margin-top: 5px; display: none; }
        
        .chart-container {
            width: 100%; max-width: 400px; margin: 20px auto 40px auto;
            background: white; padding: 15px; border-radius: 12px;
            box-shadow: 0px 4px 10px rgba(0,0,0,0.1);
            display: none; 
            box-sizing: border-box;
        }
        
        .seletor-box { margin-bottom: 15px; text-align: left; }
        .seletor-box label { font-size: 14px; font-weight: bold; color: #333; display: block; margin-bottom: 5px; }
        select { width: 100%; padding: 10px; font-size: 16px; border-radius: 6px; border: 1px solid #ccc; }
        
        #meuGrafico { width: 100% !important; height: auto !important; display: block; }
    </style>
</head>
<body>

    <h2>Análise Clínica de Motricidade</h2>
    
    <div id="status">Carregando IA...</div>
    <div id="contador">Frames: 0</div>
    
    <div class="video-container">
        <video id="videoElement" autoplay playsinline></video>
        <canvas id="canvasElement"></canvas>
    </div>

    <div class="botoes-container">
        <button id="btnStartCamera" disabled>Ligar Câmera</button>
        
        <div class="botoes-linha">
            <button id="btnToggleMask">👁️ Máscara</button>
            <button id="btnSwitchCamera">🔄 Inverter</button>
        </div>

        <button id="btnRecord">🔴 Iniciar Gravação</button>
        <button id="btnStop">⏹ Parar Avaliação</button>
    </div>

    <div class="chart-container" id="chartContainer">
        <div class="seletor-box">
            <label for="seletorMetrica">Visualizar movimento de:</label>
            <select id="seletorMetrica">
                <option value="boca">Abertura da Boca</option>
                <option value="olho_esq">Piscar - Olho Esquerdo</option>
                <option value="olho_dir">Piscar - Olho Direito</option>
                <option value="sobrancelha">Elevação - Sobrancelha Esq.</option>
            </select>
        </div>
        <canvas id="meuGrafico"></canvas>
        
        <button id="btnDownloadRaw" class="btn-export">📥 Baixar Série Temporal (Dados Brutos)</button>
        <button id="btnDownloadAmp" class="btn-export">📊 Baixar Amplitudes (Mapa de Tiques)</button>
    </div>

    <script type="module">
        import { FaceLandmarker, FilesetResolver, DrawingUtils } from "https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.0/vision_bundle.js";

        const video = document.getElementById('videoElement');
        const canvas = document.getElementById('canvasElement');
        const canvasCtx = canvas.getContext('2d');
        const statusText = document.getElementById('status');
        const contadorText = document.getElementById('contador');
        
        const btnStartCamera = document.getElementById('btnStartCamera');
        const btnSwitchCamera = document.getElementById('btnSwitchCamera');
        const btnToggleMask = document.getElementById('btnToggleMask');
        const btnRecord = document.getElementById('btnRecord');
        const btnStop = document.getElementById('btnStop');
        const btnDownloadRaw = document.getElementById('btnDownloadRaw');
        const btnDownloadAmp = document.getElementById('btnDownloadAmp');
        
        const chartContainer = document.getElementById('chartContainer');
        const seletorMetrica = document.getElementById('seletorMetrica');

        let faceLandmarker;
        let drawingUtils;
        let serieTemporal = []; 
        let isCameraAtiva = false;
        let isGravando = false;
        let mostrarMascara = true; 
        let lastVideoTime = -1;
        let tempoInicioGravacao = 0;
        let frameIndex = 0; // Para espelhar a coluna 
        let meuGrafico = null; 
        
        let currentStream = null;
        let tipoCamera = "user"; 
        let animationFrameId = null; 

        seletorMetrica.addEventListener('change', () => {
            if (serieTemporal.length > 0) gerarGrafico();
        });

        btnToggleMask.addEventListener('click', () => {
            mostrarMascara = !mostrarMascara;
            btnToggleMask.style.opacity = mostrarMascara ? "1" : "0.5";
            if (!mostrarMascara) canvasCtx.clearRect(0, 0, canvas.width, canvas.height);
        });

        // 1. Inicializa a IA
        async function carregarModelo() {
            try {
                const vision = await FilesetResolver.forVisionTasks("https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.0/wasm");
                faceLandmarker = await FaceLandmarker.createFromOptions(vision, {
                    baseOptions: {
                        modelAssetPath: "https://storage.googleapis.com/mediapipe-models/face_landmarker/face_landmarker/float16/1/face_landmarker.task",
                        delegate: "CPU"
                    },
                    outputFaceBlendshapes: false,
                    runningMode: "VIDEO",
                    numFaces: 1
                });
                
                drawingUtils = new DrawingUtils(canvasCtx);
                statusText.innerText = "IA Pronta!";
                statusText.style.color = "green";
                btnStartCamera.disabled = false;
            } catch (erro) {
                statusText.innerText = "Erro na IA: " + erro.message;
            }
        }
        carregarModelo();

        // 2. Ligar a Câmera
        async function iniciarCamera() {
            if (animationFrameId) window.cancelAnimationFrame(animationFrameId);
            if (currentStream) currentStream.getTracks().forEach(track => track.stop());

            try {
                currentStream = await navigator.mediaDevices.getUserMedia({ 
                    video: { facingMode: tipoCamera, width: { ideal: 640 }, height: { ideal: 480 } } 
                });
                video.srcObject = currentStream;
                isCameraAtiva = true;

                if (tipoCamera === "user") {
                    video.classList.add("espelhado");
                    canvas.classList.add("espelhado");
                } else {
                    video.classList.remove("espelhado");
                    canvas.classList.remove("espelhado");
                }
                
                video.onloadeddata = () => {
                    canvas.width = video.videoWidth;
                    canvas.height = video.videoHeight;
                    
                    btnStartCamera.style.display = "none";
                    btnSwitchCamera.style.display = "block"; 
                    btnSwitchCamera.disabled = false; 
                    btnToggleMask.style.display = "block"; 
                    btnRecord.style.display = "block";
                    
                    statusText.innerText = "Câmera Ativa. Pronto para avaliar.";
                    lastVideoTime = -1; 
                    processarCamera(); 
                };
            } catch (err) {
                statusText.innerText = "Erro ao acessar câmera.";
                btnSwitchCamera.disabled = false;
            }
        }

        btnStartCamera.addEventListener('click', iniciarCamera);

        btnSwitchCamera.addEventListener('click', () => {
            btnSwitchCamera.disabled = true; 
            isCameraAtiva = false; 
            tipoCamera = tipoCamera === "user" ? "environment" : "user";
            iniciarCamera();
        });

        // 3. Loop contínuo da Câmera 
        function processarCamera() {
            if (!isCameraAtiva) return;

            let startTimeMs = performance.now();
            if (lastVideoTime !== video.currentTime) {
                lastVideoTime = video.currentTime;
                const resultados = faceLandmarker.detectForVideo(video, startTimeMs);

                canvasCtx.clearRect(0, 0, canvas.width, canvas.height);

                if (resultados.faceLandmarks && resultados.faceLandmarks.length > 0) {
                    const marcos = resultados.faceLandmarks[0];

                    if (mostrarMascara) {
                        drawingUtils.drawConnectors(marcos, FaceLandmarker.FACE_LANDMARKS_TESSELATION, { color: "#C0C0C070", lineWidth: 1 });
                    }

                    if (isGravando) {
                        let tempoAtual = (performance.now() - tempoInicioGravacao) / 1000;
                        
                        // Salvamos os dados 100% crus do MediaPipe
                        let coordenadasDoFrame = [];
                        for (let i = 0; i < 468; i++) {
                            coordenadasDoFrame.push(marcos[i].x.toFixed(6));
                            coordenadasDoFrame.push(marcos[i].y.toFixed(6));
                            coordenadasDoFrame.push(marcos[i].z.toFixed(6));
                        }

                        // Métricas do gráfico 1D (Apenas visualização do app)
                        let metricaBoca = Math.abs(marcos[14].y - marcos[13].y);
                        let metricaOlhoEsq = Math.abs(marcos[159].y - marcos[145].y); 
                        let metricaOlhoDir = Math.abs(marcos[386].y - marcos[374].y); 
                        let metricaSobrancelha = Math.abs(marcos[70].y - marcos[159].y); 

                        serieTemporal.push({
                            frame: frameIndex,
                            tempo_segundos: tempoAtual.toFixed(3),
                            dadosRaw: coordenadasDoFrame,
                            boca: metricaBoca,
                            olho_esq: metricaOlhoEsq,
                            olho_dir: metricaOlhoDir,
                            sobrancelha: metricaSobrancelha
                        });

                        frameIndex++;
                        contadorText.innerText = `Gravando... ${serieTemporal.length} frames`;
                    }
                }
            }
            animationFrameId = window.requestAnimationFrame(processarCamera);
        }

        // 4. Controles de Gravação
        btnRecord.addEventListener('click', () => {
            serieTemporal = []; 
            frameIndex = 0;
            isGravando = true;
            tempoInicioGravacao = performance.now();
            
            chartContainer.style.display = "none"; 
            btnRecord.style.display = "none";
            btnStop.style.display = "block";
            btnDownloadRaw.style.display = "none";
            btnDownloadAmp.style.display = "none";
            
            btnSwitchCamera.disabled = true; 
            
            contadorText.style.display = "block";
            statusText.innerText = "Avaliando Motricidade...";
            statusText.style.color = "red";
        });

        btnStop.addEventListener('click', () => {
            isGravando = false;
            btnStop.style.display = "none";
            btnRecord.style.display = "block";
            btnRecord.innerText = "🔄 Nova Avaliação";
            
            btnSwitchCamera.disabled = false; 
            
            statusText.innerText = "Avaliação Concluída! Exporte os dados.";
            statusText.style.color = "green";
            
            if (serieTemporal.length === 0) return alert("Nenhum rosto detectado!");

            gerarGrafico();
            chartContainer.style.display = "block";
            btnDownloadRaw.style.display = "block";
            btnDownloadAmp.style.display = "block";
            
            setTimeout(() => {
                chartContainer.scrollIntoView({ behavior: 'smooth', block: 'end' });
            }, 300);
        });

        // 5. Gráfico Visual
        function gerarGrafico() {
            const ctx = document.getElementById('meuGrafico').getContext('2d');
            const filtroEscolhido = seletorMetrica.value;
            const nomeFiltro = seletorMetrica.options[seletorMetrica.selectedIndex].text;

            const labelsTempo = serieTemporal.map(item => item.tempo_segundos);
            const dadosEixoY = serieTemporal.map(item => item[filtroEscolhido]);

            if (meuGrafico) meuGrafico.destroy(); 

            meuGrafico = new Chart(ctx, {
                type: 'line',
                data: {
                    labels: labelsTempo,
                    datasets: [{
                        label: nomeFiltro,
                        data: dadosEixoY,
                        borderColor: '#007bff',
                        backgroundColor: '#007bff33', 
                        borderWidth: 2, pointRadius: 0, fill: true, tension: 0.4 
                    }]
                },
                options: { responsive: true }
            });
        }

        // Exportação 1: Raw Data Completo
        btnDownloadRaw.addEventListener('click', () => {
            let csvContent = "Frame,Tempo(s)";
            for (let i = 0; i < 468; i++) {
                csvContent += `,Pt${i}_X,Pt${i}_Y,Pt${i}_Z`;
            }
            csvContent += "\n";

            serieTemporal.forEach(linha => {
                csvContent += `${linha.frame},${linha.tempo_segundos},${linha.dadosRaw.join(',')}\n`;
            });

            baixarArquivo(csvContent, `dados_brutos_${Date.now()}.csv`);
        });

        // Exportação 2: Amplitudes de Deslocamento (Amplitudes_Facemesh)
        btnDownloadAmp.addEventListener('click', () => {
            let csvContent = "Ponto;X_medio;Y_medio;Amplitude_de_deslocamento\n";
            
            for (let ponto_id = 0; ponto_id < 468; ponto_id++) {
                let xs = [];
                let ys = [];
                
                // Extrai todos os X e Y daquele ponto específico ao longo de todos os frames
                serieTemporal.forEach(frame => {
                    xs.push(parseFloat(frame.dadosRaw[ponto_id * 3]));     // X
                    ys.push(parseFloat(frame.dadosRaw[ponto_id * 3 + 1])); // Y
                });

                if (xs.length > 1) {
                    let amp_x = Math.max(...xs) - Math.min(...xs);
                    let amp_y = Math.max(...ys) - Math.min(...ys);
                    let amplitude = Math.sqrt(Math.pow(amp_x, 2) + Math.pow(amp_y, 2));
                    
                    let x_medio = xs.reduce((a, b) => a + b, 0) / xs.length;
                    let y_medio = ys.reduce((a, b) => a + b, 0) / ys.length;

                    // Formato exato do seu código Python (separado por ponto e vírgula)
                    csvContent += `${ponto_id};${x_medio.toFixed(6)};${y_medio.toFixed(6)};${amplitude.toFixed(6)}\n`;
                }
            }

            baixarArquivo(csvContent, `amplitudes_facemesh_${Date.now()}.csv`, 'text/csv;charset=utf-8;');
        });

        function baixarArquivo(conteudo, nomeArquivo, tipo = 'text/csv;charset=utf-8;') {
            const blob = new Blob([conteudo], { type: tipo });
            const link = document.createElement("a");
            const url = URL.createObjectURL(blob);
            link.setAttribute("href", url);
            link.setAttribute("download", nomeArquivo);
            document.body.appendChild(link);
            link.click();
            document.body.removeChild(link);
        }
    </script>
</body>
</html>
